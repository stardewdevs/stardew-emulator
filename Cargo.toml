[package]
name = "stardew-emulator"
version = "0.11.1"
edition = "2021"
authors = ["Stardewdevs"]
description = "Terminal emulation engine for Stardew"
license = "Apache-2.0"
repository = "https://github.com/stardewdevs/stardew-emulator"
homepage = "https://github.com/stardewdevs/stardew-emulator"
documentation = "https://github.com/stardewdevs/stardew-emulator/docs"

[dependencies]
alacritty_terminal = "0.25"
vte = "0.14"
grid = "0.14"
portable-pty = "0.8"
rustix = { version = "0.38", features = ["pty", "termios"] }
jni = { version = "0.21", optional = true }
jni-sys = { version = "0.3", optional = true }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
crossfont = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1.11"
time = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", optional = true }
ndk-sys = { version = "0.6", optional = true }
glue = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
rand = "0.8"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:jni"]
android = ["dep:ndk", "dep:ndk-sys", "dep:glue"]
