[package]
name = "stardew-emulator"
version = "0.11.1"
edition = "2021"
authors = ["Stardewdevs"]
description = "Terminal emulation engine for Stardew, powered by alacritty_terminal."
license = "Apache-2.0"
repository = "https://github.com/stardewdevs/stardew-emulator"
homepage = "https://github.com/stardewdevs/stardew-emulator"
documentation = "https://github.com/stardewdevs/stardew-emulator/docs"

[dependencies]
alacritty_terminal = "0.25.0"
portable-pty = "0.8"
rustix = { version = "0.38", features = ["pty", "termios"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
anyhow = "1.0.95"
thiserror = "2.0.11"
log = "0.4.26"
env_logger = "0.11.6"
jni = { version = "0.21.0", optional = true }
jni-sys = { version = "0.3.0", optional = true }
lazy_static = "1.5.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", optional = true }
ndk-sys = { version = "0.6.0", optional = true }
glue = { version = "0.3.0", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:jni"]
android = ["dep:ndk", "dep:ndk-sys", "dep:glue"]
